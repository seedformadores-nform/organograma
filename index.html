        const normalizePhotoUrl = (url) => {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}=s260`;
            }
            return url;
        };

        const SafeImage = ({ src, alt, className = '', style = {}, fallbackName = '?' }) => {
            const [imgSrc, setImgSrc] = useState(normalizePhotoUrl(src));
            const [hasError, setHasError] = useState(false);

            const handleError = () => {
                const match = src?.match(/\/d\/([a-zA-Z0-9_-]+)/) || src?.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1] && !imgSrc.includes('drive.google.com/uc')) {
                    setImgSrc(`https://drive.google.com/uc?export=view&id=${match[1]}`);
                } else {
                    setHasError(true);
                }
            };

            if (hasError || !src) {
                const initial = fallbackName.trim().charAt(0).toUpperCase();
                return (
                    <div className={`w-full h-full flex items-center justify-center bg-slate-100 text-slate-700 font-black select-none ${className}`}>
                        <span className="text-lg md:text-xl">{initial}</span>
                    </div>
                );
            }

            return (
                <img 
                    src={imgSrc} 
                    alt={alt} 
                    className={className} 
                    style={style} 
                    referrerPolicy="no-referrer"
                    onError={handleError} 
                />
            );
        };

        const MandeCarinhoModal = ({ nres, isOpen, onClose, stats = {}, onSaveCarinho, initialTutor = null }) => {
            const [selectedNre, setSelectedNre] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [feedbackToast, setFeedbackToast] = useState(null);
            const [isSending, setIsSending] = useState(false);

            useEffect(() => {
                if (initialTutor && isOpen) {
                    const foundNre = nres.find(n => n.name === initialTutor.nreName) || nres[0];
                    setSelectedNre(foundNre);
                }
            }, [initialTutor, isOpen]);

            if (!isOpen) return null;

            const handleClose = () => {
                setSelectedNre(null);
                setSearchTerm('');
                setFeedbackToast(null);
                onClose();
            };

            const sendGest = async (tutor, nreObj, gestType) => {
                setIsSending(true);

                const gestNames = {
                    smile: 'um Sorriso de Gratidão 😊',
                    handshake: 'um Abraço e Parceria 🤝',
                    heart: 'um Coração de Reconhecimento ❤️'
                };

                const emailDestino = nreObj.email || tutor.email;

                await onSaveCarinho(tutor.id, gestType, {
                    tutorName: tutor.name,
                    nreName: nreObj.name,
                    tutorEmail: emailDestino
                });

                setIsSending(false);

                setFeedbackToast({
                    tutorName: tutor.name,
                    nreName: nreObj.name,
                    tutorEmail: emailDestino,
                    gest: gestNames[gestType]
                });

                setTimeout(() => {
                    setFeedbackToast(null);
                }, 4800);
            };

            const filteredNres = nres.filter(nre => {
                const term = searchTerm.toLowerCase().trim();
                if (!term) return true;
                const matchesNre = nre.name.toLowerCase().includes(term);
                const matchesTutor = nre.tutores.some(t => t.name.toLowerCase().includes(term));
                return matchesNre || matchesTutor;
            });

            const currentTutores = selectedNre 
                ? selectedNre.tutores.filter(t => !searchTerm || t.name.toLowerCase().includes(searchTerm.toLowerCase().trim()))
                : [];

                                            onClick={() => { setSelectedNre(null); setSearchTerm(''); }}

                                    </div>

                                    </p>

                                        </div>
                                    ) : (
                                        currentTutores.map(tutor => {
                                            const tutorData = stats[tutor.id] || { smile: 0, handshake: 0, heart: 0 };

                                            return (
                                                <div 
                                                    key={tutor.id} 
                                                    className="p-3.5 bg-white rounded-2xl border border-rose-100 shadow-sm hover:shadow-md transition-shadow flex items-center justify-between gap-3"
                                                >
                                                    <div className="flex items-center gap-3 overflow-hidden">
                                                        <div className="w-12 h-12 rounded-full border-2 border-rose-200 overflow-hidden shrink-0 bg-slate-100">
                                                            <SafeImage 
                                                                src={tutor.driveUrl} 
                                                                alt={tutor.name} 
                                                                className="w-full h-full object-cover" 
                                                                fallbackName={tutor.name} 
                                                            />
                                                        </div>
                                                        <div className="overflow-hidden">
                                                            <h4 className="font-extrabold text-slate-800 text-xs sm:text-sm leading-tight truncate">
                                                                {tutor.name}
                                                            </h4>
                                                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-tight mt-0.5">
                                                                Tutor(a) de Formação
                                                            </p>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-1.5 shrink-0">
                                                        <button 
                                                            disabled={isSending}
                                                            onClick={() => sendGest(tutor, selectedNre, 'smile')}
                                                            className="p-2 sm:p-2.5 rounded-xl border border-amber-300 text-amber-500 hover:bg-amber-50 hover:scale-110 active:scale-95 transition-all shadow-sm relative" 
                                                            title="Mandar Sorriso / Gratidão"
                                                        >
                                                            <IconSmile />
                                                            <span className="absolute -top-1.5 -right-1.5 bg-amber-500 text-white text-[9px] px-1 rounded-full font-bold">
                                                                {tutorData.smile || 0}
                                                            </span>
                                                        </button>
                                                        
                                                        <button 
                                                            disabled={isSending}
                                                            onClick={() => sendGest(tutor, selectedNre, 'handshake')}
                                                            className="p-2 sm:p-2.5 rounded-xl border border-emerald-300 text-emerald-500 hover:bg-emerald-50 hover:scale-110 active:scale-95 transition-all shadow-sm relative" 
                                                            title="Mandar Abraço e Parceria"
                                                        >
                                                            <IconHandshake />
                                                            <span className="absolute -top-1.5 -right-1.5 bg-emerald-600 text-white text-[9px] px-1 rounded-full font-bold">
                                                                {tutorData.handshake || 0}
                                                            </span>
                                                        </button>

                                                        <button 
                                                            disabled={isSending}
                                                            onClick={() => sendGest(tutor, selectedNre, 'heart')}
                                                            className="p-2 sm:p-2.5 rounded-xl border border-rose-300 text-rose-500 hover:bg-rose-50 hover:scale-110 active:scale-95 transition-all shadow-sm relative" 
                                                            title="Mandar Coração de Reconhecimento"
                                                        >
                                                            <IconHeart />
                                                            <span className="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[9px] px-1 rounded-full font-bold">
                                                                {tutorData.heart || 0}
                                                            </span>
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            ) : (
                                <div>
                                    <span className="text-[10px] font-black uppercase text-rose-500 tracking-wider mb-2.5 block">
                                        NRES
                                    </span>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                        {filteredNres.map(nre => (
                                            <button 
                                                key={nre.id} 
                                                onClick={() => { setSelectedNre(nre); setSearchTerm(''); }}
                                                className="flex items-start gap-2.5 p-3 rounded-2xl bg-white border border-rose-100 hover:border-rose-300 hover:shadow-md transition text-left group active:scale-[0.98]"
                                            >
                                                <div className="p-1 rounded-lg text-rose-400 group-hover:text-rose-600 transition shrink-0 mt-0.5">
                                                    <IconMapPin />
                                                </div>
                                                <div className="overflow-hidden">
                                                    <h5 className="text-xs font-extrabold text-rose-950 group-hover:text-rose-600 transition leading-tight truncate">
                                                        {nre.name}
                                                    </h5>
                                                    <p className="text-[10px] text-rose-400 font-semibold mt-0.5">
                                                        {nre.tutores.length} {nre.tutores.length > 1 ? 'tutores' : 'tutor'}
                                                    </p>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        };

        const PersonCard = ({ person, color, searchTerm, onClick, nreInfo, stats = {} }) => {
            const matches = searchTerm && (
                person.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                person.role.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (nreInfo && nreInfo.name.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            return (
                <div 
                    onClick={() => onClick({ ...person, email: nreInfo?.email, phone: nreInfo?.phone, nreName: nreInfo?.name }, color)} 
                    className={`flex items-center gap-3 p-3.5 rounded-2xl bg-white border border-slate-100 shadow-sm transition-all h-full w-full cursor-pointer group ${matches ? 'ring-4 ring-pink-500 scale-[1.03] z-10 shadow-pink-100' : 'hover:border-slate-300 hover:shadow-md active:scale-95'}`}
                >
                    <div className="w-12 h-12 rounded-full border-2 border-slate-100 overflow-hidden shrink-0 group-hover:scale-105 transition-transform" style={{ borderColor: color || COLORS.slate }}>
                        <SafeImage 
                            src={person.driveUrl} 
                            alt={person.name} 
                            className="w-full h-full object-cover transition-transform" 
                            fallbackName={person.name}
                        />
                    </div>
                    <div className="overflow-hidden min-w-0 flex-1">
                        <h4 className="font-extrabold text-slate-800 text-[11px] uppercase leading-tight truncate">{person.name}</h4>
                        <p className="text-[9px] text-slate-500 font-bold uppercase tracking-tight mt-0.5 truncate">{person.role}</p>
                    </div>
                </div>
            );
        };

        const NreCard = ({ nre, searchTerm, onSelect, forceExpanded, stats = {} }) => {
            const [isExpanded, setIsExpanded] = useState(true);
            const expanded = forceExpanded !== null ? forceExpanded : isExpanded;

            const matchesNre = searchTerm && (
                nre.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                nre.email.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className={`flex flex-col gap-3 w-full print:max-w-none ${matchesNre ? 'ring-2 ring-blue-500 rounded-3xl p-1' : ''}`}>
                    <div 
                        style={{ borderTop: `6px solid ${nre.color}` }} 
                        className="bg-white p-6 rounded-3xl shadow-lg border border-slate-100 flex flex-col items-center text-center cursor-pointer hover:shadow-xl transition-shadow group print:shadow-none print:border-t-4"
                        onClick={() => onSelect(nre, nre.color)}
                    >
                        <h2 className="text-base font-black text-slate-900 uppercase leading-snug tracking-tight">
                            NRE {nre.name}
                        </h2>

                        <p className="text-[11px] text-slate-400 font-bold uppercase mt-1">
                            {nre.tutores.length} {nre.tutores.length > 1 ? 'Tutores de Formação' : 'Tutor de Formação'}
                        </p>

                        <button 
                            onClick={(e) => { e.stopPropagation(); setIsExpanded(!expanded); }} 
                            className="mt-4 w-full flex items-center justify-center gap-1.5 py-2 border-t border-slate-50 text-slate-400 hover:text-slate-700 transition-colors print:hidden"
                        >
                            <span className="text-[10px] font-black uppercase tracking-wider">
                                {expanded ? 'Recolher Tutores' : `Ver Tutores (${nre.tutores.length})`}
                            </span>
                            {expanded ? <IconChevronDown /> : <IconChevronRight />}
                        </button>
                    </div>

                    {expanded && (
                        <div className="grid grid-cols-1 gap-2 print:grid-cols-1">
                            {nre.tutores.map(tutor => (
                                <PersonCard 
                                    key={tutor.id} 
                                    person={tutor} 
                                    color={nre.color} 
                                    searchTerm={searchTerm} 
                                    onClick={onSelect}
                                    nreInfo={nre}
                                    stats={stats}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [searchTerm, setSearchTerm] = useState('');
            const [zoom, setZoom] = useState(1);
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedColor, setSelectedColor] = useState(null);
            const [forceExpanded, setForceExpanded] = useState(true);
            const [isCarinhoOpen, setIsCarinhoOpen] = useState(false);
            const [showCarinhoToastCard, setShowCarinhoToastCard] = useState(true);
            const [initialCarinhoTutor, setInitialCarinhoTutor] = useState(null);

            const [carinhosStats, setCarinhosStats] = useState({
                'apu_1': { smile: 8, handshake: 5, heart: 12 },
                'cta_1': { smile: 14, handshake: 9, heart: 22 },
                'mga_1': { smile: 11, handshake: 6, heart: 18 }
            });

            const handleSaveCarinho = (tutorId, gestType, meta) => {
                setCarinhosStats(prev => {
                    const current = prev[tutorId] || { smile: 0, handshake: 0, heart: 0 };
                    return {
                        ...prev,
                        [tutorId]: {
                            ...current,
                            [gestType]: (current[gestType] || 0) + 1
                        }
                    };
                });
            };

            const totalTutores = useMemo(() => {
                return nresData.reduce((acc, curr) => acc + curr.tutores.length, 0);
            }, []);

            const filteredNres = useMemo(() => {
                const term = searchTerm.toLowerCase().trim();
                if (!term) return nresData;
                return nresData.filter(item => {
                    return (
                        item.name.toLowerCase().includes(term) ||
                        item.email.toLowerCase().includes(term) ||
                        item.tutores.some(t => t.name.toLowerCase().includes(term))
                    );
                });
            }, [searchTerm]);

            const handleSelect = (item, color) => {
                setSelectedItem(item);
                setSelectedColor(color);
            };

            const handleOpenCarinhoForTutor = (tutor) => {
                setInitialCarinhoTutor(tutor);
                setIsCarinhoOpen(true);
            };

            const handlePrint = () => {
                window.focus();
                const originalZoom = zoom;
                setZoom(1);
                setTimeout(() => {
                    try { window.print(); } catch (err) {}
                    setZoom(originalZoom);
                }, 500);
            };

            return (
                <div className="min-h-screen p-4 sm:p-6 md:p-12 print:bg-white print:p-4">
                    <Modal 
                        item={selectedItem} 
                        color={selectedColor} 
                        stats={carinhosStats}
                        onClose={() => setSelectedItem(null)} 
                        onOpenCarinhoForTutor={handleOpenCarinhoForTutor}
                    />
                    
                    <MandeCarinhoModal 
                        nres={nresData} 
                        isOpen={isCarinhoOpen} 
                        stats={carinhosStats}
                        initialTutor={initialCarinhoTutor}
                        onSaveCarinho={handleSaveCarinho}
                        onClose={() => {
                            setIsCarinhoOpen(false);
                            setInitialCarinhoTutor(null);
                        }} 
                    />

                    {showCarinhoToastCard && !isCarinhoOpen && (
                        <div className="fixed bottom-6 right-6 z-50 max-w-[340px] w-full bg-[#fff1f5] border-2 border-rose-200 rounded-[2rem] p-5 shadow-2xl no-print">
                            <button 
                                onClick={() => setShowCarinhoToastCard(false)}
                                className="absolute top-4 right-4 p-1 text-rose-400 hover:text-rose-700 transition"
                                title="Fechar aviso"
                            >
                                <IconX />
                            </button>

                            <div className="flex items-center gap-3">
                                <div className="w-11 h-11 rounded-full bg-rose-500 text-white flex items-center justify-center shrink-0 shadow-md shadow-rose-200">
                                    <IconHeart fill="white" />
                                </div>
                                <div className="overflow-hidden">
                                    <h3 className="text-base font-extrabold text-rose-950 leading-tight">Mande um carinho!</h3>
                                    <p className="text-[11px] font-semibold text-rose-500">Para um Tutor do programa</p>
                                </div>
                            </div>

                            <p className="text-xs text-rose-900/80 font-medium mt-3 leading-relaxed">
                                Os Tutores dedicam seu tempo em orientar e apoiar os formadores e cursistas. Que tal enviar um gesto de carinho para agradecer? É super rápido e faz a diferença!
                            </p>

                            <button 
                                onClick={() => {
                                    setInitialCarinhoTutor(null);
                                    setIsCarinhoOpen(true);
                                }}
                                className="mt-4 w-full py-3 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white rounded-2xl font-extrabold text-xs shadow-lg shadow-rose-200 transition-all active:scale-95 flex items-center justify-center gap-1.5"
                            >
                                <span>Escolher Tutor</span>
                                <span>💛</span>
                            </button>
                        </div>
                    )}
                    
                    <div className="max-w-[1700px] mx-auto mb-10 flex flex-col xl:flex-row xl:items-end justify-between gap-6 border-b border-slate-300 pb-8 no-print">
                        <div className="flex flex-col sm:flex-row sm:items-center gap-5">
                            <img 
                                src="https://lh3.googleusercontent.com/d/1dxKM7C_oDPbtE6YNYFTGCZ_55n1IlZg-" 
                                alt="Logo Formadores em Ação" 
                                className="h-16 md:h-20 w-auto object-contain shrink-0"
                                onError={(e) => {
                                    e.currentTarget.onerror = null;
                                    e.currentTarget.src = "https://drive.google.com/uc?export=view&id=1dxKM7C_oDPbtE6YNYFTGCZ_55n1IlZg-";
                                }}
                            />
                            <div>
                                <div className="flex items-center gap-3 mb-2">
                                    <span className="w-3 h-3 rounded-full bg-[#008744]"></span>
                                    <span className="text-xs font-black tracking-widest uppercase text-slate-500">Secretaria de Estado da Educação do Paraná</span>
                                </div>
                                <h1 className="text-2xl md:text-3xl font-black text-slate-900 uppercase tracking-tighter">
                                    Organograma da Tutoria de Formação • 32 NREs
                                </h1>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-4">
                            <button 
                                onClick={() => {
                                    setInitialCarinhoTutor(null);
                                    setIsCarinhoOpen(true);
                                }}
                                className="py-3.5 px-5 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white rounded-3xl text-xs font-black uppercase tracking-wider shadow-md shadow-rose-200 transition active:scale-95 flex items-center gap-2"
                            >
                                <IconHeart fill="white" />
                                <span>Mande um Carinho 💛</span>
                            </button>

                            <div className="relative group">
                                <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></div>
                                <input 
                                    type="text" 
                                    placeholder="Pesquisar NRE ou Tutor..." 
                                    className="pl-12 pr-6 py-3.5 bg-white border-2 border-slate-200 rounded-3xl w-72 sm:w-80 focus:border-blue-500 outline-none shadow-sm transition-all text-slate-700 text-sm font-semibold" 
                                    value={searchTerm} 
                                    onChange={(e) => setSearchTerm(e.target.value)} 
                                />
                            </div>

                            <button 
                                onClick={() => setForceExpanded(!forceExpanded)}
                                className="py-3.5 px-5 bg-white border-2 border-slate-200 text-slate-700 hover:bg-slate-50 rounded-3xl text-xs font-black uppercase tracking-wider shadow-sm transition active:scale-95"
                            >
                                {forceExpanded ? 'Recolher Todos' : 'Expandir Todos'}
                            </button>

                            <div className="flex bg-white rounded-3xl border-2 border-slate-200 p-1.5 shadow-sm">
                                <button onClick={() => setZoom(Math.max(zoom - 0.1, 0.4))} className="p-2.5 hover:bg-slate-50 rounded-2xl text-slate-600"><IconZoomOut /></button>
                                <button onClick={() => setZoom(1)} className="p-2.5 font-black text-xs text-slate-500 px-3 uppercase">100%</button>
                                <button onClick={() => setZoom(Math.min(zoom + 0.1, 1.5))} className="p-2.5 hover:bg-slate-50 rounded-2xl text-slate-600"><IconZoomIn /></button>
                            </div>

                            <button onClick={handlePrint} className="p-4 bg-slate-900 text-white rounded-3xl shadow-lg hover:bg-slate-800 active:scale-95 transition" title="Imprimir / Salvar PDF">
                                <IconPrinter />
                            </button>
                        </div>
                    </div>

                    <div style={{ transform: `scale(${zoom})`, transformOrigin: 'top center' }} className="max-w-[1700px] mx-auto w-full print-full transition-transform duration-150">
                        <div className="flex flex-col items-center mb-16 relative">
                            <div 
                                style={{ borderTop: `8px solid ${COLORS.navy}` }} 
                                className="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-200 text-center w-full max-w-[620px] relative z-10 print:shadow-none print:border-t-4"
                            >
                                <h1 className="text-2xl sm:text-3xl font-black text-slate-900 uppercase tracking-tighter leading-none mt-1">
                                    Programa Formadores em Ação
                                </h1>
                                <p className="text-xs font-black text-blue-700 uppercase tracking-widest mt-2">
                                    Tutoria de Formação nos 32 Núcleos Regionais de Educação
                                </p>
                                
                                <div className="grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-100 text-center max-w-sm mx-auto">
                                    <div className="p-3 bg-slate-50 rounded-2xl">
                                        <span className="block text-[11px] text-slate-400 font-bold uppercase tracking-wider">Núcleos</span>
                                        <span className="text-lg font-black text-slate-800">32 NREs</span>
                                    </div>
                                    <div className="p-3 bg-slate-50 rounded-2xl">
                                        <span className="block text-[11px] text-slate-400 font-bold uppercase tracking-wider">Tutores</span>
                                        <span className="text-lg font-black text-blue-700">{totalTutores} Ativos</span>
                                    </div>
                                </div>
                            </div>

                            <div className="h-14 w-1.5 bg-slate-300 no-print" />
                        </div>

                        <div className="relative">
                            {filteredNres.length === 0 ? (
                                <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8">
                                    <p className="text-sm font-bold text-slate-500 uppercase">Nenhum NRE ou tutor encontrado para os critérios pesquisados.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-4 gap-6 items-start justify-items-center print:block">
                                    {filteredNres.map(nre => (
                                        <div key={nre.id} className="w-full print:block print:mb-8">
                                            <NreCard 
                                                nre={nre} 
                                                searchTerm={searchTerm} 
                                                onSelect={handleSelect}
                                                forceExpanded={forceExpanded}
                                                stats={carinhosStats}
                                            />
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                    </div>

                    {/* Rodapé Institucional */}
                    <footer className="mt-16 pt-8 pb-6 border-t border-slate-300 text-center text-slate-500 text-xs no-print">
                        <div className="max-w-5xl mx-auto px-4 space-y-1.5 font-medium leading-relaxed">
                            <p className="font-extrabold text-slate-700 tracking-tight text-[13px]">
                                Núcleo Formadores em Ação - Secretaria de Estado de Educação do Paraná
                            </p>
                            <p className="text-slate-500">
                                Av. Presidente Kennedy, 2511 - Guaíra - Curitiba | PR
                            </p>
                            <p className="text-slate-600">
                                Contato: <a href="mailto:seed_formadores@escola.pr.gov.br" className="font-bold text-blue-700 hover:underline">seed_formadores@escola.pr.gov.br</a>
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
